<!DOCTYPE html>
<html>
<head>
    <title>{{ doc['title'] }} - SecureDoc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #10131f;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .card {
            background: #181e2c;
            border: 1px solid #2a3144;
            border-radius: 24px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.5);
        }
        .card-header {
            background: #0f131f;
            border-bottom: 1px solid #2a3144;
            padding: 1.2rem 1.5rem;
            border-radius: 24px 24px 0 0;
        }
        .card-header h3 {
            font-weight: 600;
            color: #e2e8ff;
            margin: 0;
        }
        .btn-secondary {
            background: #2d374b;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 500;
        }
        .btn-secondary:hover {
            background: #404b66;
        }
        .text-muted {
            color: #8d9ac0 !important;
        }
        .bg-white {
            background: #0f131f !important;
            border: 1px solid #2a3144;
            border-radius: 20px;
            color: #cfdfee;
            line-height: 1.6;
        }
        hr {
            background-color: #2a3144;
            opacity: 0.6;
        }
        .badge-doc {
            background: #1e2a3a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #7e9bc0;
        }
    </style>
</head>
<body>
    <div class="container mt-5 pt-3">
        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3><i class="fas fa-file-alt me-2 text-primary"></i>{{ doc['title'] }}</h3>
                <a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i>Back</a>
            </div>
            <div class="card-body">
                <p class="text-muted small"><i class="fas fa-fingerprint me-1"></i>Document ID: <span class="badge-doc">{{ doc['id'] }}</span></p>
                <hr>
                <div class="p-4 bg-white border rounded">
                    {{ doc['content'] }}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
