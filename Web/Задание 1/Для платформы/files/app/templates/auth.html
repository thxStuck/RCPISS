<!DOCTYPE html>
<html>
<head>
    <title>Auth - SecureDoc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1e2b 0%, #2d3349 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: #1e2434;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
        }
        .card-body {
            padding: 2rem;
        }
        h2 {
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #eef2ff;
        }
        .form-label {
            font-weight: 500;
            color: #b9c3e6;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            background-color: #0f121c;
            border: 1px solid #2d374b;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s;
        }
        .form-control:focus {
            background-color: #0f121c;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
            color: white;
        }
        .btn-primary {
            background: #2563eb;
            border: none;
            border-radius: 40px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px #1e3a8a;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
        .alert {
            background: #2d2f42;
            border-left: 4px solid #f97316;
            color: #fde68a;
            border-radius: 12px;
        }
        .text-center a {
            font-size: 0.9rem;
        }
        .badge-soft {
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <span class="badge-soft"><i class="fas fa-shield-alt me-1"></i> SECURE ACCESS</span>
                        </div>
                        <h2 class="text-center mb-4">{{ title }}</h2>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-arrow-right-to-bracket me-2"></i>{{ title }}
                            </button>
                        </form>
                        {% if title == 'Login' %}
                        <p class="mt-4 text-center">No account? <a href="/register">Create secure account</a></p>
                        {% else %}
                        <p class="mt-4 text-center">Have account? <a href="/login">Sign in</a></p>
                        {% endif %}
                        {% with messages = get_flashed_messages() %}
                          {% if messages %}
                            {% for message in messages %}
                              <div class="alert mt-3"><i class="fas fa-info-circle me-2"></i>{{ message }}</div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
